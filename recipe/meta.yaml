{% set name = "mf2py" %}
{% set version = "2.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/mf2py-{{ version }}.tar.gz
  sha256: 2851972e514673add74cd2f2898453a50945029ea4a7d32cfdbf231985282ee9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >={{ python_min }}
    - html5lib >=1.1.0,<2.0.0
    - requests >=2.28.2,<3.0.0
    - beautifulsoup4 >=4.11.1,<5.0.0

test:
  imports:
    - mf2py
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/microformats/mf2py
  doc_url: https://microformats.github.io/mf2py/
  summary: Microformats2 parser written in Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
